kind: pipeline
type: docker
name: build-and-deploy

trigger:
  branch:
    include:
      - master

steps:
  - name: build-image
    image: docker:20.10
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
    commands:
      - echo "🔨 Building Docker image..."
      - docker build -t my-node-app:latest .

  - name: redeploy
    image: docker:20.10
    volumes:
      - name: dockersock
        path: /var/run/docker.sock
      - name: envfile
        path: /env
    commands:
      - echo "🛑 Stopping old container (if any)"
      - docker rm -f my-node-app || true
      - echo "🚀 Starting new container"
      - >
        docker run -d
        --name my-node-app
        --env-file /env/.env
        -p 3000:3000
        my-node-app:latest

volumes:
  - name: dockersock
    host:
      path: /var/run/docker.sock
  - name: envfile
    host:
      path: /root/envs/chs/frontend
